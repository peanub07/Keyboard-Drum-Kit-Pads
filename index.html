<!doctype html>
<html>
  <head>
    <title>Keyboard Drum Kit Pads</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Keyboard Drum Kit Pads</h1>
    <div class="drumset">
      <div class="leftHandSide">
        <span>
          <button class="crashSide pad" title="Side Crash" onclick="triggerPad('e')">e</button>
          <button class="cowbell pad" title="Cowbell" onclick="triggerPad('r')">r</button>
        </span>
        <span>
          <button class="midTom pad" title="Mid Tom" onclick="triggerPad('a')">a</button>
          <button class="highTom pad" title="High Tom" onclick="triggerPad('s')">s</button>
          <button class="ride pad" title="Ride" onclick="triggerPad('d')">d</button>
          <button class="snare pad" title="Snare" onclick="triggerPad('f')">f</button>
        </span>
        <button class="lowTom pad" title="Low Tom" onclick="triggerPad('shift')">shift</button>
      </div>

      <div class="rightHandSide">
        <button class="crashMain pad" title="Main Crash" onclick="triggerPad('i')">i</button>
        <span>
          <button class="kick pad" title="Kick" onclick="triggerPad('j')">j</button>
          <button class="hiHatClosed pad" title="Closed HiHat" onclick="triggerPad('k')">k</button>
        </span>
        <button class="hiHatOpen pad" title="Open HiHat" onclick="triggerPad('m')">m</button>
      </div>
    </div>
  </body>
</html>
