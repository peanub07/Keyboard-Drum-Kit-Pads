<!doctype html>
<html>
  <head>
    <title>Keyboard Drum Kit Pads</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Keyboard Drum Kit Pads</h1>
    <div class="drumset">
      <div class="leftHandSide">
        <span>
          <button class="e_crashSide pad" onclick="triggerPad('e')">e</button>
          <button class="r_cowbell pad" onclick="triggerPad('r')">r</button>
        </span>
        <span>
          <button class="a_midTom pad" onclick="triggerPad('a')">a</button>
          <button class="s_highTom pad" onclick="triggerPad('s')">s</button>
          <button class="d_ride pad" onclick="triggerPad('d')">d</button>
          <button class="f_snare pad" onclick="triggerPad('f')">f</button>
        </span>
        <button class="shift_lowTom pad" onclick="triggerPad('shift')">shift</button>
      </div>

      <div class="rightHandSide">
        <button class="i_crashMain pad" onclick="triggerPad('i')">i</button>
        <span>
          <button class="j_kick pad" onclick="triggerPad('j')">j</button>
          <button class="k_hiHatClosed pad" onclick="triggerPad('k')">k</button>
        </span>
        <button class="m_hiHatOpen pad" onclick="triggerPad('m')">m</button>
      </div>
    </div>
  </body>
</html>
