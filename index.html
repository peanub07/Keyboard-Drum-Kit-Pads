<!doctype html>
<html>
  <head>
    <title>Keyboard Drum Kit Pads</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Keyboard Drum Kit Pads</h1>
    <div class="drumset">
      <div class="leftHandSide">
        <span>
          <button class="crashSide pad" onclick="triggerPad('e')">e</button>
          <button class="cowbell pad" onclick="triggerPad('r')">r</button>
        </span>
        <span>
          <button class="midTom pad" onclick="triggerPad('a')">a</button>
          <button class="highTom pad" onclick="triggerPad('s')">s</button>
          <button class="ride pad" onclick="triggerPad('d')">d</button>
          <button class="snare pad" onclick="triggerPad('f')">f</button>
        </span>
        <button class="lowTom pad" onclick="triggerPad('shift')">shift</button>
      </div>

      <div class="rightHandSide">
        <button class="crashMain pad" onclick="triggerPad('i')">i</button>
        <span>
          <button class="kick pad" onclick="triggerPad('j')">j</button>
          <button class="hiHatClosed pad" onclick="triggerPad('k')">k</button>
        </span>
        <button class="hiHatOpen pad" onclick="triggerPad('m')">m</button>
      </div>
    </div>
  </body>
</html>
